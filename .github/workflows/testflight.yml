name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [tr3k, main]

jobs:
  ios:
    name: Sign and upload
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_ANIMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - run: node scripts/patch-ios.mjs

      - name: Require the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY_ID:-}" ] || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_KEY_P8:-}" ] || missing+=(ASC_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "App Store Connect API key secrets are present."

      - name: Prepare signing inputs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["ASC_KEY_P8"].strip()
          if "\\n" in raw and "-----BEGIN" in raw:
              raw = raw.replace("\\n", "\n").strip()
          raw += "\n"
          lines = raw.splitlines()
          first, last = lines[0], lines[-1]
          if not first.startswith("-----BEGIN ") or "PRIVATE KEY-----" not in first:
              raise SystemExit("ASC_KEY_P8 is not a PEM private key")
          if not last.startswith("-----END ") or "PRIVATE KEY-----" not in last:
              raise SystemExit("ASC_KEY_P8 is not a PEM private key")

          key_id = os.environ["ASC_KEY_ID"].strip()
          if not key_id or any(token in key_id for token in ("/", "\\", "..")):
              raise SystemExit("ASC_KEY_ID cannot be used as a file name")

          dest_dir = Path(os.environ["RUNNER_TEMP"]) / "private_keys"
          dest_dir.mkdir(parents=True, exist_ok=True)
          path = dest_dir / f"AuthKey_{key_id}.p8"
          path.write_text(raw)
          path.chmod(0o600)

          home_keys = Path.home() / ".appstoreconnect" / "private_keys"
          home_keys.mkdir(parents=True, exist_ok=True)
          copy = home_keys / path.name
          copy.write_text(raw)
          copy.chmod(0o600)

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          build_number = max(20023, 20000 + run_number)
          with Path(os.environ["GITHUB_ENV"]).open("a") as handle:
              handle.write(f"ASC_KEY_PATH={path}\n")
              handle.write(f"BUILD_NUMBER={build_number}\n")
          print(f"API key file ready ({path.stat().st_size} bytes). Build number {build_number}.")
          PY

      - name: Select Xcode 27.1 for the Duo SDK
        run: bash scripts/select-xcode.sh

      - name: Require the iOS 27.1 SDK before upload
        run: |
          set -euo pipefail
          if [ "${TR3K_XCODE_DUO:-0}" != "1" ]; then
            echo "TestFlight upload for the Duo submission needs Xcode 27.1 or newer."
            echo "Active result from scripts/select-xcode.sh is TR3K_XCODE_DUO=${TR3K_XCODE_DUO:-unset}."
            echo "Archive steps: docs/iphone-duo.md"
            exit 1
          fi
          xcodebuild -version

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane beta

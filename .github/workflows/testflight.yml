name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [tr3k, main]

jobs:
  ios:
    name: Sign and upload
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - run: node scripts/patch-ios.mjs

      - name: Require signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY_ID:-}" ] || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_KEY_P8:-}" ] || missing+=(ASC_KEY_P8)
          if [ -n "${MATCH_GIT_URL:-}" ]; then
            [ -n "${MATCH_PASSWORD:-}" ] || missing+=(MATCH_PASSWORD)
          elif [ -n "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            [ -n "${P12_PASSWORD:-}" ] || missing+=(P12_PASSWORD)
          else
            missing+=(BUILD_CERTIFICATE_BASE64 P12_PASSWORD)
            echo "No distribution certificate is configured."
            echo "Either set BUILD_CERTIFICATE_BASE64 and P12_PASSWORD,"
            echo "or set MATCH_GIT_URL and MATCH_PASSWORD (and MATCH_GIT_BASIC_AUTHORIZATION for a private https repo)."
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Keychain and API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" tr3k-signing.keychain-db
          security set-keychain-settings -lut 21600 tr3k-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" tr3k-signing.keychain-db
          security list-keychains -d user -s tr3k-signing.keychain-db
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k tr3k-signing.keychain-db -T /usr/bin/codesign -T /usr/bin/security
          if [ -z "${MATCH_GIT_URL:-}" ]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
            security import "$RUNNER_TEMP/dist.p12" -f pkcs12 -k tr3k-signing.keychain-db -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" tr3k-signing.keychain-db
            rm -f "$RUNNER_TEMP/dist.p12"
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta
